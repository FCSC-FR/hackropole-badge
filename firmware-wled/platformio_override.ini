[platformio]
default_envs = WLED_hackropole

[env:WLED_hackropole]
extends = env:esp32s3_4M_qspi
; 8 WS281x LEDs on GPIO 2 and 1 WS281x LED on GPIO 21
; Touch buttons on GPIO 6, 1, 3, 4, 5, 7, 8, 9, 10
build_flags = ${common.build_flags} ${esp32s3.build_flags} -D WLED_RELEASE_NAME=\"ESP32-WLED_hackropole\"
  -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DLOLIN_WIFI_FIX
  -DWLED_AP_SSID_UNIQUE
  -D WLED_WATCHDOG_TIMEOUT=0
  ${esp32.AR_build_flags}
  -D DATA_PINS=2,21 -D PIXEL_COUNTS=8,1
  -D WLED_MAX_BUTTONS=9 -D BTNPIN=6,1,3,4,5,7,8,9,10 -D BTNTYPE=6,6,6,6,6,6,6,6,6
